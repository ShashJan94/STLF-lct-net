[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "STLF-lct-net"            # pick your final name
version = "0.1.0"
description = "Load forecasting with CNN + LCT + causal MHA; fold-aware loaders and calibrated inference."
readme = "README.md"
authors = [{name="Shashwata Chowdhury"}]
requires-python = ">=3.9"
license = {text = "MIT"}
# NOTE: Torch should be installed depending on the device mode, hence left out.
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "meteostat>=1.6",
  "holidays>=0.45",
  "hijri-converter>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.3",
  "ruff>=0.5",
  "mypy>=1.8",
  "pytest>=8.0",
  "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]

"*" = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[project.scripts]
# simple CLIs (wire these later if you want)
gridcast-train = "src.experiments.train_single:main"
gridcast-calibrate = "src.evaluation.calibration:main"
gridcast-predict = "src.inference.cli:main"
